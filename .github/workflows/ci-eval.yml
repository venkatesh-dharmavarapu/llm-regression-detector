name: Continuous LLM Evaluation

on:
  push:
    paths:
      - 'prompts/**'
  pull_request:
    paths:
      - 'prompts/**'

jobs:
  evaluate-prompts:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the source code repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Configure runtime Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Fast install project dependencies from requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Note on local execution vs cloud actions
    - name: Run Pipeline Stub Check
      run: |
        echo "Validating code syntax and structure before deployment..."
        python -m py_compile src/main.py src/models.py src/evaluator.py
        echo "Architecture compilation successful! Local models are secure."